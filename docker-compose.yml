name: discord-project-manager

services:
  postgres:
    image: postgres:18-alpine
    container_name: discord_project_manager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dgg_pm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dgg_pm"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: discord_project_manager_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/dgg_pm
      AUTO_RUN_MIGRATIONS: "true"
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: discord_project_manager_postgres_data
